services:
  agent:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./data:/app
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    stop_grace_period: 15s
